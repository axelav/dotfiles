onboarding = false

[ui]
status_indicators = "symbols"
sidebar_max_width = 60
prompt_new_tab_name = false

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
  ],
  [
    "branch",
    "git_status",
  ],
  [
    { token = "$pr", dim = true, rules = [
      { starts_with = "●", fg = "#a6e3a1" },
      { starts_with = "◐", fg = "#f9e2af" },
      { starts_with = "⊗", fg = "#f38ba8", bold = true },
      { starts_with = "◆", fg = "#cba6f7" },
      { starts_with = "◌", fg = "#bac2de" },
      { starts_with = "⊘", fg = "#9399b2" },
    ] },
    { token = "$pr_checks", dim = true, rules = [
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "…", fg = "#f9e2af" },
      { starts_with = "✗", fg = "#f38ba8", bold = true },
    ] },
    { token = "$pr_review", dim = true, rules = [
      { equals = "approved", fg = "#a6e3a1" },
      { equals = "changes req", fg = "#f38ba8" },
      { equals = "review req", fg = "#f9e2af" },
    ] },
  ],
  [
    "$pr_threads",
  ],
]

# Show each agent's task title alongside its location and lifecycle state.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "state_text"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+space"
last_pane = "prefix+;"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save snapshot"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore-preview"
description = "resurrect: preview restore"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore snapshot"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+a"
type = "popup"
command = "aven tui"
description = "open aven"
width = "100%"
height = "100%"

[theme]
name = "catppuccin"
auto_switch = false
