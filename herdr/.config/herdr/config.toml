onboarding = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+space"
last_pane = ["prefix+;", "prefix+shift+l"]

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save snapshot"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore-preview"
description = "resurrect: preview restore"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore snapshot"
