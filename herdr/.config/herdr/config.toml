onboarding = false

[ui]
status_indicators = "symbols"

# Show each agent's task title alongside its location and lifecycle state.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "state_text"],
  ["terminal_title_stripped"],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+space"
last_pane = "prefix+;"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save snapshot"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore-preview"
description = "resurrect: preview restore"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore snapshot"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"
