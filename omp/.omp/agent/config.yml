defaultThinkingLevel: medium
modelRoles:
  slow: openai-codex/gpt-6-astra:xhigh
  tiny: openai-codex/gpt-6-luna:low
  advisor: openai-codex/gpt-6-luna:medium
  smol: openai-codex/gpt-6-luna:off
  web: openai-codex/gpt-6-luna:medium
  default: openai-codex/gpt-6.1-sol:high
extensionRenderers:
  transcriptPresenters: true
dev:
  autoqa: false
  autoqaConsent: denied
symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light
setupVersion: 3
statusLine:
  preset: full
  contextLine: annotated
  compactThinkingLevel: false
  transparent: false
  sessionAccent: true
memory:
  backend: local
autolearn:
  enabled: false
tui:
  tight: true
  scrollbackRebuild: true
composer:
  shape: band
advisor:
  enabled: true
  maxNotesPerUpdate: 2
codexResets:
  autoRedeem: "yes"
update:
  auto: true
retry:
  fallbackOn: usage-limit
  fallbackChains:
    openai-codex/*:
      - openai/*